name: heremes-codex-agents
version: 0.2.0
description: "Claude subagents for Hermes with additional Codex subscription agents: original Opus/Sonnet/Haiku roles plus explicit Sol/Luna roles. Agents are Markdown files (the Claude Code agent format) with a fixed model and tool set; read-only agents are enforced by a pre_tool_call guard. Uses the public subagent lifecycle API; no core patch."
author: Francisco; adapted from Seppe Gadeyne
kind: standalone
manifest_version: 2
api_version: 1
requires_hermes: ">=0.21.6"
license: MIT
tags: [delegation, subagents, claude, codex, orchestration]
config_schema:
  provider:
    type: str
    default: claude-subscription-directsdk-experimental
    label: Agent provider
    description: Provider the agents run on unless an agent file names its own. Use inherit to run them on the lead agent's provider.
  agent_dirs:
    type: list
    default: ["{hermes_home}/claude-agents", "{hermes_home}/codex-agents"]
    label: Agent folders
    description: Folders with agent Markdown files, read after the built-in agents. A later file with the same name replaces an earlier one.
  import_claude_code_agents:
    type: bool
    default: false
    label: Import ~/.claude/agents
    description: Also load Claude Code's own agent files.
  overrides:
    type: dict
    default: {}
    label: Per-agent overrides
    description: "Change an agent without editing its file, for example {\"codex-reviewer\": {\"model\": \"gpt-6.1-sol-900k\"}, \"builder\": {\"enabled\": false}}. Keys: model, provider, effort, enabled."
  max_parallel:
    type: int
    default: 12
    label: Agents per call
    description: Most tasks one agents_run call may start (1-16).
  max_live_runs:
    type: int
    default: 24
    label: Live runs per conversation
    description: Most agent runs one conversation may have in progress (1-32).
  max_parallel_writers:
    type: int
    default: 1
    label: Parallel writers
    description: Most agents that can change files running at once (0-8). Read-only agents do not count.
  wait_seconds:
    type: int
    default: 600
    label: Wait for results (seconds)
    description: How long agents_run waits before it returns run_ids (0-1800). Always capped 25 seconds below Hermes' tool deadline (timeouts.tools.sequential_call, default 420).
  diff_max_chars:
    type: int
    default: 20000
    label: Diff budget (characters)
    description: Largest git diff attached to an agent's context with attach_diff (1000-30000).
  summary_max_chars:
    type: int
    default: 12000
    label: Report budget (characters)
    description: Longest agent report returned to the lead per run (1000-32000).
  nudge_after:
    type: int
    default: 8
    label: Scouting nudge
    description: After this many read or search calls by the lead in one turn without agents, add a one-time hint to use read-only agents (0 turns it off, max 50).
  prompt_section:
    type: bool
    default: true
    label: Prompt guidance
    description: Add a short roster and usage guide to the lead's system prompt.
provides_tools: [agents_run, agents_status]
provides_hooks: [pre_tool_call, subagent_start, subagent_stop, transform_tool_result]
