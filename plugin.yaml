name: hermes-agent-crew
version: 0.9.1
description: "Named subagents for Hermes on any provider, local models included: strong models review, balanced models build, fast models swarm. The lead is the session's own model. Agents are Markdown files (the Claude Code agent format) with a fixed tier or model and tool set; read-only agents are enforced by a pre_tool_call guard. Uses the public subagent lifecycle API; no core patch."
author: Seppe Gadeyne
kind: standalone
manifest_version: 2
api_version: 1
requires_hermes: ">=0.21.6"
license: MIT
homepage: https://github.com/seppegadeyne/hermes-agent-crew
tags: [delegation, subagents, orchestration, local-models, multi-provider]
config_schema:
  provider:
    type: str
    default: claude-subscription-directsdk-experimental
    label: Agent provider
    description: Provider the agents run on unless an agent file, a tier or an override names its own. Use inherit to run them on the lead agent's provider.
  agent_dirs:
    type: list
    default: ["{hermes_home}/claude-agents"]
    label: Agent folders
    description: Folders with agent Markdown files, read after the built-in agents. A later file with the same name replaces an earlier one.
  import_claude_code_agents:
    type: bool
    default: false
    label: Import ~/.claude/agents
    description: Also load Claude Code's own agent files.
  overrides:
    type: dict
    default: {}
    label: Per-agent overrides
    description: "Change an agent without editing its file, for example {\"reviewer\": {\"model\": \"sonnet\"}, \"builder\": {\"enabled\": false}}. Keys: model, provider, effort, enabled."
  tiers:
    type: dict
    default: {strong: {model: opus}, balanced: {model: sonnet}, fast: {model: haiku}}
    label: Model tiers
    description: "What runs each tier the agent files name (strong, balanced, fast): a model and optionally a provider, for example {\"fast\": {\"provider\": \"my-local-server\", \"model\": \"qwen\"}}. A tier without a provider uses the Agent provider setting. Local servers need at least a 64K context window."
  max_parallel:
    type: int
    default: 12
    label: Agents per call
    description: Most tasks one agents_run call may start (1-16).
  max_live_runs:
    type: int
    default: 24
    label: Live runs per conversation
    description: Most agent runs one conversation may have in progress (1-32).
  max_parallel_writers:
    type: int
    default: 1
    label: Parallel writers
    description: Most agents that can change files running at once while one of them has no write_scope (0-8). Writers that all have disjoint write scopes run side by side; read-only agents never count; 0 turns writers off.
  wait_seconds:
    type: int
    default: 600
    label: Wait for results (seconds)
    description: How long agents_run waits before it returns run_ids (0-1800). Always capped 25 seconds below Hermes' tool deadline (timeouts.tools.sequential_call, default 420).
  diff_max_chars:
    type: int
    default: 20000
    label: Diff budget (characters)
    description: Largest git diff attached to an agent's context with attach_diff (1000-30000).
  summary_max_chars:
    type: int
    default: 12000
    label: Report budget (characters)
    description: Longest agent report returned to the lead per run (1000-32000).
  nudge_after:
    type: int
    default: 8
    label: Scouting nudge
    description: After this many read or search calls by the lead in one turn without agents, add a one-time hint to use read-only agents (0 turns it off, max 50).
  plan_max_items:
    type: int
    default: 24
    label: Items per plan stage
    description: Most findings one plan stage may fan out over (1-64). A stage that finds more fails and lists them, so the lead can split the job.
  prompt_section:
    type: bool
    default: true
    label: Prompt guidance
    description: Add a short roster and usage guide to the lead's system prompt.
provides_tools: [agents_run, agents_status]
provides_hooks: [pre_tool_call, subagent_start, subagent_stop, transform_tool_result]
